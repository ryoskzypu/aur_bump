name: 'AUR package update checker'

on:
  workflow_call:
    inputs:
      packages:
        description: 'Which AUR packages to check. Value must be a JSON array (maximum of 256 packages)'
        type: string
        required: true

jobs:
  check-packages:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: ${{ fromJson(inputs.packages) }}

      max-parallel: 3

    steps:
      - name: 'Generate GitHub App token'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 'Install + cache apt dependencies'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libio-socket-ssl-perl makepkg nvchecker
          version: 1.0

      - uses: actions/checkout@v7
      - name: 'Check package version'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGE_NAME: ${{ matrix.package }}

        shell: bash
        run: |
          chmod +x check_pkg
          ./check_pkg
