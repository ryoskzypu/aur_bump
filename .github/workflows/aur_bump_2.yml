name: 'aur_bump_2 (AUR package update checker)'
description: 'Call check_packages.yml weekly at midnight UTC (Sunday)'

on:
  schedule:
    - cron: '0 0 * * Sun'

  workflow_dispatch:

jobs:
  call-check-packages:
    uses: ryoskzypu/aur_bump/.github/workflows/check_packages.yml@main
    with:
      maintainer: 'ryoskzypu'
      packages: '["perl-xml-namespace","perl-xml-namespacefactory"]'

    secrets: inherit
