name: 'AUR package update checker'

on:
  schedule:
    - cron: '0 0 * * Sun'  # Weekly at midnight UTC.

  workflow_dispatch:

jobs:
  fetch-packages:
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.fetch.outputs.packages }}

    steps:
      - name: 'Install dependencies'
        run: |
          sudo apt update
          sudo apt install -y libio-socket-ssl-perl  # HTTP::Tiny TLS support

      - name: 'Fetch AUR packages from maintainer'
        id: fetch
        shell: bash
        run: |
          packages=$(
              perl -MHTTP::Tiny -MJSON::PP -E '
                  my $MAINTAINER = q{ryoskzypu};

                  my $res = HTTP::Tiny->new->get("https://aur.archlinux.org/rpc/v5/search/$MAINTAINER?by=maintainer");
                  die "Failed to fetch AUR\n" unless $res->{success};

                  if ( length $res->{content} ) {
                      my $json = decode_json( $res->{content} );

                      die "No packages found from $MAINTAINER\n"
                        unless scalar $json->{results}->@*;

                      my @pkgs;
                      foreach my $pkg ( $json->{results}->@* ) {
                          push @pkgs, $pkg->{Name}
                            if $pkg->{Name} !~ /-(?> bzr | cvs | darcs | git | hg | svn )\z/x;  # Exclude VCS pkgs
                      }

                      my $matrix = encode_json \@pkgs;
                      print $matrix;
                  }
                  else {
                    die "No response content\n";
                  }
              '
          )
          printf 'packages=%s\n' "$packages" >> $GITHUB_OUTPUT
          printf '%s\n' "Found packages: $packages"

  generate-token:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.app-token.outputs.token }}

    steps:
      - name: 'Generate GitHub App token'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          skip-token-revoke: true

  check-packages:
    needs: [fetch-packages, generate-token]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: ${{ fromJson(needs.fetch-packages.outputs.packages) }}

      max-parallel: 6

    steps:
      - name: 'Install + cache apt dependencies'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: makepkg nvchecker
          version: 1.0

      - name: Check package version
        id: version-check
        env:
          GH_TOKEN: ${{ needs.generate-token.outputs.token }}

        shell: bash
        run: |
          # Based on 'pkgctl version check' and bumpbuddy.
          # https://gitlab.archlinux.org/archlinux/devtools/-/blob/master/src/lib/version/check.sh
          # https://gitlab.archlinux.org/archlinux/bumpbuddy/-/blob/master/checker.sh

          set -o pipefail

          package=${{ matrix.package }}
          printf '%s\n' "Checking $package version"

          git clone https://aur@aur.archlinux.org/"$package".git
          cd "$package" || exit 1

          config=.nvchecker.toml

          for file in PKGBUILD "$config"; do
              if [[ ! -f $file ]]; then
                  printf '%s\n' "$file does not exist" >&2
                  exit 1
              fi
          done

          # Reset common PKGBUILD vars.
          unset pkgbase pkgname arch source pkgver pkgrel validpgpkeys

          # Get PKGBUILD vars.
          source ./PKGBUILD

          pkgbase=${pkgbase:-$pkgname}
          upstream_url=$url
          package_url=https://aur.archlinux.org/packages/$pkgbase

          # Get upstream version using nvchecker.
          if upstream_version=$(
              nvchecker \
                  --file "$config" \
                  --logger=json \
                  2> /dev/null \
              | jq \
                  --raw-output \
                  --exit-status \
                  'select(.name == "'"$pkgbase"'") | .version' \
                  2> /dev/null
              )
          then
              if [[ -n $upstream_version && $upstream_version != 'null' ]]; then
                  if ! result=$(vercmp "$upstream_version" "$pkgver"); then
                      printf '%s\n' "$pkgbase: failed to compare version $upstream_version against $pkgver" >&2
                      exit 1
                  fi

                  # Check if issue already exists.
                  if ! issue=$(
                      gh issue list \
                          --search "author:aur-bump-bot '$pkgbase - new version: ' in:title" \
                          --label 'package out-of-date' \
                          --state open \
                          --limit 1 \
                          --json number \
                          --jq '.[].number'
                      )
                  then
                      printf '%s\n' "$pkgbase: failed to check issue for $pkgbase" >&2
                      exit 1
                  fi

                  if (( result == 0 )); then
                      printf '%s\n' "$pkgbase: current version $pkgver is latest"

                      if [[ -n $issue ]]; then
                          printf '%s\n' "$pkgbase: current version $pkgver is latest, closing existing issue #$issue"

                          gh issue close "$issue" --comment "Current version $pkgver is latest, closing the issue."
                      fi

                  elif (( result < 0 )); then
                      printf '%s\n' "$pkgbase: current version $pkgver is newer than $upstream_version"
                  elif (( result > 0 )); then
                      printf '%s\n' "$pkgbase: upgrade from version $pkgver to $upstream_version"

                      title="$pkgbase - new version: $upstream_version"
                      body="pkgbase: $pkgbase
          pkgver: $pkgver
          upstream_version: $upstream_version
          upstream_url: $upstream_url
          package_url: $package_url"

                      if [[ -n $issue ]]; then
                          # Extract versions from existing issue.

                          if ! existing_body=$(gh issue view "$issue" --json body --jq '.body'); then
                              printf '%s\n' "$pkgbase: failed to fetch issue #$issue" >&2
                              exit 1
                          fi

                          mapfile -t body_arr <<< "$existing_body"

                          for i in "${body_arr[@]}"; do
                              [[ $i = pkgver:* ]]           && existing_pkgver=${i#*: }
                              [[ $i = upstream_version:* ]] && existing_upstream=${i#*: }
                          done

                          # Only update if versions have changed.
                          if [[ $existing_pkgver != "$pkgver" || $existing_upstream != "$upstream_version" ]]; then
                              printf '%s\n' "$pkgbase: updating issue #$issue with new versions"

                              if ! gh issue edit \
                                  "$issue" \
                                  --title "$title" \
                                  --body "$body"
                              then
                                  printf '%s\n' "$pkgbase: failed to update issue #$issue" >&2
                                  exit 1
                              fi
                          else
                              printf '%s\n' "$pkgbase: issue #$issue already has current version info"
                          fi
                      else
                          printf '%s\n' "$pkgbase: creating issue"

                          if ! gh issue create \
                              --label 'package out-of-date' \
                              --title "$title" \
                              --body "$body"
                          then
                              printf '%s\n' "$pkgbase: failed to create issue #$issue" >&2
                              exit 1
                          fi
                      fi
                   fi
              else
                  printf '%s\n' "$pkgbase: failed to get upstream version" >&2
                  exit 1
              fi
          else
              printf '%s\n' "$pkgbase: nvchecker failed to fetch upstream version" >&2
              exit 1
          fi
